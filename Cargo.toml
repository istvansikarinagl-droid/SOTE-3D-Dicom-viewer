[package]
name = "ct_viewer"
version = "0.10.1"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
dicom = "0.8"
dicom-pixeldata = "0.8"
half = "2.5"
rfd = "0.15"
image = "0.25"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
debug = "line-tables-only"
