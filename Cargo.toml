[package]
name = "ct_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
dicom = "0.7"
dicom-pixeldata = "0.7"
half = "2"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
